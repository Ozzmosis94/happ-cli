name: Network proxy validation

on:
  push:
    branches: [feat/lan-network-proxy, feat/optional-multi-lan-cidrs]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o happ-lan ./cmd/happ
